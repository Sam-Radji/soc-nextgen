<!-- ============================================================
     Extrait ossec.conf — Intégrations SOC NextGen
     À ajouter dans /var/ossec/etc/ossec.conf
     ============================================================ -->

<!-- Intégration Python Flask Bridge -->
<integration>
  <name>custom-python</name>
  <hook_url>http://192.168.40.20:5050/webhook</hook_url>
  <level>7</level>
  <alert_format>json</alert_format>
</integration>

<!-- Intégration n8n SOAR -->
<integration>
  <name>custom-n8n</name>
  <hook_url>http://192.168.40.20:5678/webhook/wazuh</hook_url>
  <level>10</level>
  <alert_format>json</alert_format>
</integration>
